const POSES = {
  ready:  {shin:82, thigh:100, torso:78, uarm:265, farm:280, pole:262, head:6,  face:0},
  tuck:   {shin:52, thigh:168, torso:10, uarm:196, farm:186, pole:187, head:22, face:-4},
  ext:    {shin:74, thigh:82,  torso:46, uarm:202, farm:194, pole:192, head:8,  face:4},
  flight: {shin:30, thigh:26,  torso:21, uarm:191, farm:187, pole:185, head:14, face:2},
  land:   {shin:62, thigh:128, torso:68, uarm:330, farm:346, pole:300, head:2,  face:0},
  stand:  {shin:80, thigh:102, torso:80, uarm:292, farm:284, pole:262, head:4,  face:0},
  banzai: {shin:80, thigh:102, torso:82, uarm:70,  farm:85,  pole:95,  head:8,  face:20},
  fall:   {shin:24, thigh:66,  torso:138,uarm:92,  farm:50,  pole:35,  head:-10,face:60},
  down:   {shin:172,thigh:178, torso:182,uarm:150, farm:168, pole:125, head:-6, face:95}
};
function lerpPose(a, b, t){ const o = {}; for(const k in a) o[k] = lerp(a[k], b[k], t); return o; }
const dir = a => [Math.cos(a * DEG), Math.sin(a * DEG)];
const add = (p, d, l) => [p[0] + d[0] * l, p[1] + d[1] * l];
function joints(P, back){
  const sh = back ? P.shin + 7 : P.shin, th = back ? P.thigh - 5 : P.thigh;
  const ankle = back ? [-0.07, 0.1] : [0, 0.1];
  const knee = add(ankle, dir(sh), 0.5);
  const hip = add(knee, dir(th), 0.5);
  return { ankle, knee, hip };
}
function seg(a, b, w, c){ ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
function drawSki(off, rot, color){
  ctx.save(); ctx.translate(off, 0); ctx.rotate(rot * DEG);
  ctx.strokeStyle = color; ctx.lineWidth = 0.065; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-0.95, 0.035); ctx.lineTo(1.3, 0.035); ctx.quadraticCurveTo(1.55, 0.035, 1.6, 0.16); ctx.stroke();
  ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 0.05;
  ctx.beginPath(); ctx.moveTo(1.05, 0.04); ctx.lineTo(1.3, 0.04); ctx.stroke();
  ctx.restore();
}
function drawArm(P, shoulder, back){
  const ua = P.uarm + (back ? 9 : 0), fa = P.farm + (back ? 7 : 0), pa = P.pole + (back ? 5 : 0);
  const elbow = add(shoulder, dir(ua), 0.3), hand = add(elbow, dir(fa), 0.28);
  const pd = dir(pa);
  seg(add(hand, pd, -0.06), add(hand, pd, 1.15), 0.035, back ? '#64748b' : '#475569');
  const bk = add(hand, pd, 1.0);
  ctx.fillStyle = back ? '#64748b' : '#334155'; ctx.beginPath(); ctx.arc(bk[0], bk[1], 0.045, 0, Math.PI * 2); ctx.fill();
  const col = back ? '#172e6e' : '#1e40af';
  seg(shoulder, elbow, 0.13, col); seg(elbow, hand, 0.115, col);
  ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(hand[0], hand[1], 0.065, 0, Math.PI * 2); ctx.fill();
}
function drawSkier(sx, sy, ang, P, opt){
  opt = opt || {};
  const k = SK * (opt.scale || 1);
  ctx.save(); ctx.translate(sx, sy); ctx.rotate(ang); ctx.scale(k, -k);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const F = joints(P, false), B = joints(P, true);
  if(opt.pivotHip){ ctx.translate(0, 0.16); ctx.translate(-F.hip[0], -F.hip[1]); }
  const td = dir(P.torso), hip = F.hip;
  const neck = add(hip, td, 0.62), shoulder = add(hip, td, 0.55);
  drawArm(P, shoulder, true);
  const vs = opt.vspread || 0;
  drawSki(-0.07, 6 * vs, '#334155');
  seg(B.ankle, B.knee, 0.165, '#172e6e'); seg(B.knee, hip, 0.2, '#172e6e');
  ctx.fillStyle = '#0b1220'; ctx.beginPath(); ctx.ellipse(B.ankle[0] + 0.04, B.ankle[1] - 0.02, 0.12, 0.07, 0, 0, Math.PI * 2); ctx.fill();
  drawSki(0, 0, '#1e293b');
  seg(hip, neck, 0.32, '#2563eb');
  const nrm = dir(P.torso + 90);
  seg(add(add(hip, td, 0.22), nrm, 0.07), add(add(hip, td, 0.6), nrm, 0.07), 0.12, '#f8fafc');
  seg(F.ankle, F.knee, 0.17, '#1e40af'); seg(F.knee, hip, 0.21, '#1e40af');
  ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.ellipse(F.ankle[0] + 0.05, F.ankle[1] - 0.02, 0.13, 0.075, 0, 0, Math.PI * 2); ctx.fill();
  const hc = add(neck, dir(P.torso + P.head), 0.17), fd = P.face;
  const fc = add(hc, dir(fd - 25), 0.045);
  ctx.fillStyle = '#f3c5a0'; ctx.beginPath(); ctx.arc(fc[0], fc[1], 0.115, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1d4ed8'; ctx.beginPath(); ctx.arc(hc[0], hc[1], 0.155, (fd + 38) * DEG, (fd + 250) * DEG, false); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3b82f6'; ctx.globalAlpha = .55; ctx.beginPath(); ctx.arc(hc[0], hc[1], 0.155, (fd + 70) * DEG, (fd + 120) * DEG, false); ctx.lineTo(hc[0], hc[1]); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
  const gp = add(hc, dir(fd + 8), 0.11);
  ctx.save(); ctx.translate(gp[0], gp[1]); ctx.rotate((fd + 8) * DEG);
  ctx.fillStyle = '#0f172a'; ctx.fillRect(-0.06, -0.05, 0.12, 0.1);
  ctx.fillStyle = '#22d3ee'; ctx.fillRect(-0.035, -0.035, 0.085, 0.07);
  ctx.restore();
  drawArm(P, shoulder, false);
  ctx.restore();
}

let state = 'title';

let sk = { x: 0, y: 0, a: 0, P: POSES.ready, pivotHip: false, v: 0, vspread: 0, scale: 1 };
let particles = [], sparts = [], speedLines = [], confetti = [];
let shake = 0, flash = 0, flashColor = '255,236,140';

let myName = store.get('pt_name', null);

let liveKm = 0, liveKmh = 0, modalOpen = false, regionLabel = '';
// flight scene
let fl = { km: 0, vkm: 1, alt: 0, space: 0, tex: 0, skY: 0, ang: 0, lastRegion: '' };
function updateTitleBest(){ $('titleBest').textContent = best ? `自己ベスト ${fmtKm(best.d)}（${best.place || best.g}）` : ''; }

let readyMode = false;
function goReady(){
  run = null; state = 'title'; readyMode = true;

}
// cont=true：0msで世界一周して富士山頂に戻り、そのまま次の周を滑り始める
function startRun(ts, cont){
  readyMode = false;
  const nextT = cont && run && run.nextT ? run.nextT : T_MIN + Math.random() * (T_MAX - T_MIN);   // 踏切までの時間は周ごとにランダム
  setRunTime(nextT, cont ? Math.min(ARR_V, 0.9 * INRUN_LEN / nextT) : null);
  if(!(cont && run && run.nextSpd)) SCREEN_SPEED = SPD_MIN + Math.random() * (SPD_MAX - SPD_MIN);   // 画面内の動きの速さも周ごとにランダム
  const lap = cont && run ? run.lap + 1 : 1, base = cont && run ? run.base + LOOP_KM : 0;
  run = { start: ts, lap, base, cont: !!cont, tapped: false, early: false, jumped: false, grade: null, dist: null, err: null, world: false, flight: null, land: null, fall: null, resultShown: false, resultAt: 0, place: '', next: false };
  state = 'inrun'; liveKm = 0; regionLabel = '';
  $('title').classList.add('hidden'); $('result').classList.add('hidden');
  hideJudge(); confetti = []; sparts = []; particles = [];
  $('toVal').textContent = '--';
  if(cont){ showJudge(`${lap}周目!`, 'perfect small', 'そのまま滑走中！踏切でタップ'); SFX.pass(); }
  else SFX.start();
}
function evTime(e){
  const n = performance.now(), t = e && e.timeStamp;
  return (t && t > 0 && Math.abs(n - t) < 500) ? t : n;
}
function onTap(ts){
  if(modalOpen) return;
  unlockAudio();
  if(state === 'title'){ startRun(ts); return; }
  if(state === 'inrun'){ tryJump(ts); return; }
  if(run && run.resultShown && performance.now() - run.resultAt > 350){ startRun(ts); }
}
function tryJump(ts){
  const tt = (ts - run.start) / 1000;
  if(tt < 0.25 || run.tapped) return;
  const err = (tt - T0) * 1000;
  if(err > LATE_MS) return;
  run.tapped = true;
  if(err < -EARLY_MS){
    run.early = true; run.err = err;
    showJudge('早すぎ!', 'miss small', '踏切ポイントの手前です');
    $('toVal').textContent = '早すぎ';
    SFX.early(); return;
  }
  doJump(tt, err);
}
function doJump(tt, err){
  const j = judge(err);
  run.jumped = true; run.err = err; run.grade = j.grade; run.dist = j.dist; run.world = j.world;
  const D = j.dist;
  const T = 2.2 + 2.6 * Math.log10(1 + D / 10);
  const wEnd = Math.min(0.5, 0.35 * T / D);
  const perfect = j.grade === 'PERFECT';
  run.flight = { tj: tt, D, T, wEnd, perfect, maxAlt: clamp(0.12 + 0.11 * Math.log10(1 + D / 10), 0.12, 0.5) };
  state = 'flight';
  fl = { km: 0, vkm: 1, alt: 0, space: 0, tex: 0, skY: 0, ang: 0, lastRegion: '' };
  const sgn = (Math.round(err) || 0) >= 0 ? '+' : '−';   // −0ms と表示しない
  $('toVal').innerHTML = `${sgn}${Math.abs(Math.round(err))}<small>ms</small>`;
  const word = perfect ? 'PERFECT!' : j.grade === 'GREAT' ? 'GREAT!' : 'GOOD';
  showJudge(word, perfect ? 'perfect' : j.grade.toLowerCase(), timingText(err));
  SFX.jump(perfect, Math.min(1, D / LOOP_KM));
  flash = 1; flashColor = perfect ? '255,236,140' : '255,255,255';
  shake = perfect ? 12 : 4;
}
function fmtErr(err){ const r = Math.round(err) || 0; return (r >= 0 ? '+' : '−') + Math.abs(r) + ' ms'; }
function timingText(err){
  const a = Math.abs(Math.round(err));
  if(a <= PERFECT_MS) return a === 0 ? 'ジャストタイミング！' : `誤差 ${a}ms`;
  return err < 0 ? `${a}ms 早い` : `${a}ms 遅い`;
}
// flight helpers
function flKm(f, s){ s = clamp(s, 0, 1); return f.D * ((1 - f.wEnd) * (1 - Math.pow(1 - s, 2.4)) + f.wEnd * s); }
function flSpeed(f, s){ s = clamp(s, 0, 1); return f.D * ((1 - f.wEnd) * 2.4 * Math.pow(1 - s, 1.4) + f.wEnd) / f.T; } // km/s
function flAltPx(f, s){ s = clamp(s, 0, 1); return 46 * Math.pow(1 - s, 1.5) + f.maxAlt * H * Math.pow(Math.sin(Math.PI * s), 0.7); }
const GY = () => H * 0.8;
const SKX = () => W * 0.36;
function groundAt(sx){ const u = (sx - W * 0.5) / (W * 0.5); return GY() + fl.space * H * 0.1 * u * u; }

const ARR_T = 1.4, ARR_V = 1000, ARR_H = 450;   // 頂上へ舞い降りる時間・速さ・高さ
function beginArrive(t0, km0){
  state = 'arrive';
  run.arrive = { t0, km0 };
  run.nextT = T_MIN + Math.random() * (T_MAX - T_MIN);
  SCREEN_SPEED = SPD_MIN + Math.random() * (SPD_MAX - SPD_MIN); run.nextSpd = true;
  flash = Math.max(flash, 0.45); flashColor = '255,255,255';
  showJudge('世界一周!', 'perfect', `${run.lap + 1}周目へ突入！`);
  SFX.world();
}
function startFall(t){
  state = 'fall';
  run.grade = 'MISS';
  run.fall = { t0: t, impact: null };
  if(!run.early){ $('toVal').textContent = 'MISS'; showJudge('MISS', 'miss', '踏切ポイントを通過…'); }
  else showJudge('MISS', 'miss', '早すぎてバランスを崩した');
  SFX.miss();
}
function land(t){
  const f = run.flight;
  const r = regionAt(f.D);
  run.land = { t, v: flSpeed(f, 1), water: r[3] === 'ocean' };
  run.place = placeName(f.D, run.world);
  state = 'landed';
  liveKm = f.D;
  const x = SKX(), y = groundAt(x);
  if(run.land.water){ SFX.splash(); splash(x, y, 70); }
  else { SFX.land(); sburst(x, y, 45, r[3]); }
  shake = Math.max(shake, run.world ? 14 : 7);
  if(run.world){ flash = 0.9; flashColor = '255,236,140'; showJudge('世界一周!', 'perfect', `${run.lap + 1}周目へ突入！`); SFX.world(); }
}

function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1800); }

/* ================= パーティクル ================= */
function burst(x, y, n, sp){
  for(let i = 0; i < n; i++){
    const a = -Math.PI * (0.1 + 0.8 * Math.random()), v = sp * (0.3 + Math.random());
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: .6 + Math.random() * .6, r: 2 + Math.random() * 4 });
  }
}
function spray(x, y, a, v, rate, dt){
  const n = rate * dt; let k = Math.floor(n) + (Math.random() < n % 1 ? 1 : 0);
  const L = 0.85 * SK * sk.scale / PPM;
  const tx = x - Math.cos(a) * L, ty = y - Math.sin(a) * L;
  const sp = Math.min(v, 60) * Math.max(1, 12 / Math.max(PPM, 0.01));
  while(k-- > 0){
    const vk = Math.max(1, 12 / Math.max(PPM, 0.01));
    particles.push({ x: tx + (Math.random() - .5) * L * .3, y: ty, vx: -Math.cos(a) * sp * (0.05 + Math.random() * .12) + (Math.random() - .5) * 2 * vk, vy: (-1 - Math.random() * 3.5) * vk, g: vk, life: 0, max: .35 + Math.random() * .45, r: 1.5 + Math.random() * 3.5 });
  }
}
// screen-space particles (flight scene)
function sburst(x, y, n, type){
  const col = type === 'desert' ? '232,194,122' : type === 'land' ? '120,180,90' : '255,255,255';
  for(let i = 0; i < n; i++){
    const a = -Math.PI * (0.05 + 0.9 * Math.random()), v = 120 + Math.random() * 380;
    sparts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 900, life: 0, max: .6 + Math.random() * .7, r: 2 + Math.random() * 4, c: col, kind: 'dot' });
  }
}
function splash(x, y, n){
  for(let i = 0; i < n; i++){
    const a = -Math.PI * (0.25 + 0.5 * Math.random()), v = 200 + Math.random() * 520;
    sparts.push({ x: x + (Math.random() - .5) * 30, y, vx: Math.cos(a) * v * .6, vy: Math.sin(a) * v, g: 1100, life: 0, max: .8 + Math.random() * .6, r: 2 + Math.random() * 5, c: i % 3 ? '255,255,255' : '147,197,253', kind: 'dot' });
  }
}
function sparkle(x, y){
  sparts.push({ x: x + (Math.random() - .5) * 30, y: y + (Math.random() - .5) * 30, vx: -200 - Math.random() * 300, vy: (Math.random() - .5) * 60, g: 0, life: 0, max: .5 + Math.random() * .5, r: 2 + Math.random() * 3, c: '255,214,60', kind: 'star' });
}
function launchConfetti(n){
  const cols = ['#ffd21f', '#ef4444', '#3b82f6', '#22c55e', '#f472b6', '#ffffff'];
  for(let i = 0; i < (n || 140); i++) confetti.push({ x: Math.random() * W, y: -20 - Math.random() * H * .5, vx: (Math.random() - .5) * 80, vy: 80 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - .5) * 10, w: 6 + Math.random() * 6, h: 4 + Math.random() * 6, c: cols[i % cols.length] });
}

/* ================= 更新 ================= */
function update(now, dt){
  let slideV = 0, windV = 0;
  if(state === 'title' || state === 'inrun' || state === 'fall'){
    const t = run ? Math.max(0, (now - run.start) / 1000) : 0;
    if(state === 'title' || state === 'inrun'){
      const p = inrunPos(state === 'title' ? 0 : t);
      if(state === 'inrun' && p.past && (run.early || (t - T0) * 1000 > LATE_MS)){ startFall(t); }
      else {
        let P = state === 'title' ? POSES.ready : (t < 0.15 && !run.cont) ? lerpPose(POSES.ready, POSES.tuck, ss(t / 0.15)) : POSES.tuck;
        // スタート画面：富士山全体。滑走中：カメラがスキーヤーに付いて一緒に動く（寄りの画で景色が高速で流れる）
        const fr = inrunFrame();
        let scale = fr.scale;
        if(state === 'title'){ PPM = W / fr.vw; cam.x = fr.cx; cam.y = fr.cy; }
        else {
          const vmin = W < H ? 70 : 110;
          // 寄りの画を倍にして景色の流れを2倍速に。踏切直前の0.6秒だけ少し引いて踏切ポイントを見せる
          const near = ss((t - (T0 - 0.6)) / 0.6);
          const vwT = Math.max(vmin * 0.8, p.v * lerp(0.1167 / SCREEN_SPEED, 0.5, near));
          const ax = 0.22 + Math.min(0.38, 0.3 * SCREEN_SPEED) * clamp(t / T0, 0, 1), ay = 0.42;
          const z = run.cont ? 1 : ss(t / 0.4);        // 最初の0.4秒で全体図からスキーヤーへ寄る（2周目以降は寄ったまま）
          const vw = Math.exp(lerp(Math.log(fr.vw), Math.log(vwT), z));
          PPM = W / vw;
          // スキーヤーの画面上の位置を、全体図での位置から追いかけ位置へなめらかに移す
          const fx = (p.x - fr.cx) / fr.vw + 0.5, fy = (p.y - fr.cy) * (W / fr.vw) / H + 0.5;
          const sxF = lerp(fx, ax, z), syF = lerp(fy, ay, z);
          cam.x = p.x - (sxF - 0.5) * vw; cam.y = p.y - (syF - 0.5) * H / PPM;
          scale = lerp(fr.scale, 1, z);
          if(t > 0.6) shake = Math.max(shake, 1.5 * clamp(p.v / 3000, 0, 1));
        }
        sk = { x: p.x, y: p.y, a: p.a, P, pivotHip: false, vspread: 0, v: state === 'title' ? 0 : p.v, scale };
        if(state === 'inrun' && !p.past){ spray(p.x, p.y, p.a, p.v, Math.min(150, 60 + p.v * 0.1), dt); slideV = p.v; }
      }
    }
    if(state === 'fall'){
      const F = run.fall, tf = t - F.t0;
      const view = phase1View(0), vw = view.vmin * 1.8;
      PPM = lerp(PPM, W / vw, 1 - Math.exp(-dt * 3));
      if(!F.impact){
        const m = missPos(t - T0), x = m.x, y = m.y, rot = 3 * tf;
        if(y >= terrainY(x)){
          F.impact = { t, x, v: 26, rot0: rot, rotEnd: Math.ceil((rot + Math.PI) / (2 * Math.PI)) * 2 * Math.PI };
          SFX.crash(); shake = 14; burst(x, terrainY(x), 70, 9);
        } else {
          sk = { x, y, a: m.a + rot, P: lerpPose(POSES.tuck, POSES.fall, ss(tf / 0.4)), pivotHip: false, vspread: 0, v: m.v, scale: 1 };
        }
      }
      if(F.impact){
        const I = F.impact, tl = t - I.t, dec = I.v / 1.1, tt = Math.min(tl, I.v / dec);
        const x = I.x + I.v * tt - 0.5 * dec * tt * tt, y = terrainY(x);
        const a = Math.atan2(terrainY(x + 0.5) - y, 0.5);
        const rot = lerp(I.rot0, I.rotEnd, easeOut(tl / 1.1));
        const P = tl < 0.7 ? POSES.fall : lerpPose(POSES.fall, POSES.down, ss((tl - 0.7) / 0.4));
        sk = { x, y, a: a + rot, P, pivotHip: true, vspread: 0, v: 0, scale: 1 };
        if(I.v - dec * tt > 1) spray(x, y, a, 20, 40, dt);
        if(tl > 1.4 && !run.resultShown) showResult();
      }
      const k = 1 - Math.exp(-dt * (tf < 0.8 ? 25 : 6));   // 飛び出した直後は素早く追いかける

  }
  $('rPlace').textContent = (miss ? '' : '📍 ') + run.summary;
  $('rErr').textContent = miss ? (run.early ? `早すぎ（${Math.abs(Math.round(run.err))}ms 前）` : '踏切できず') : fmtErr(run.err);
  $('rNew').classList.toggle('hidden', !isNew);
  $('rBest').textContent = best ? fmtKm(best.d) : '--';
  $('rNote').textContent = '';
  updateResultRank();
  hideJudge();
  $('result').classList.remove('hidden');
  if(laps > 0 || perfect){ launchConfetti(laps > 0 ? 220 : 140); SFX.fanfare(); }
  else if(isNew) SFX.fanfare();
  if(total > 0) submitScore({ distance: total, grade: run.grade, place: run.summary, err: miss ? null : Math.round(run.err) });
}
function shareText(){
  const base = '0ms ジャンプ';
  let line;
  if(run && run.total > 0){
    line = `富士山から合計 ${fmtKm(run.total)} 飛んだ！（${run.summary}）`;
  } else if(best) line = `自己ベスト ${fmtKm(best.d)}（${best.place || best.g}）！`;
  else line = '富士山から世界一周ジャンプに挑戦中！';
  return { title: base, text: `🎿🗻 ${base}\n${line}\nキミは0msで押せる？ #0msジャンプ`, url: SHARE_URL };
}
async function shareResult(){
  const s = shareText();
  try{
    if(navigator.share){ await navigator.share({ title: s.title, text: s.text, url: s.url }); return; }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  $('shareText').textContent = s.text + '\n' + s.url;
  $('lnkX').href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(s.text) + '&url=' + encodeURIComponent(s.url);
  $('lnkLine').href = 'https://social-plugins.line.me/lineit/share?url=' + encodeURIComponent(s.url) + '&text=' + encodeURIComponent(s.text);
  openModal('shareModal');
}
$('bCopy').addEventListener('click', async () => {
  const txt = $('shareText').textContent;
  try{ await navigator.clipboard.writeText(txt); toast('コピーしました'); }
  catch(e){
    try{ const r = document.createRange(); r.selectNodeContents($('shareText')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('テキストを選択しました。コピーしてください'); }catch(_){ toast('コピーできませんでした'); }
  }
});

/* ================= 世界ランキング（共有データベース） ================= */
const RANK_COL = 'world';
let db = null, userCap = null, uid = null, rankDocs = [], rankState = 'loading', rankReady = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function validDoc(d){ return d && typeof d.distance === 'number' && isFinite(d.distance) && d.distance > 0 && d.distance < 1e9; }
(async function initRank(){
  try{
    if(!window.claude || typeof window.claude.use !== 'function'){ rankState = 'off'; renderRank(); return; }
    db = await window.claude.use('db');
    userCap = await window.claude.use('user');
    if(!db){ rankState = 'off'; renderRank(); return; }
    try{ uid = userCap ? await userCap.id() : null; }catch(e){ uid = null; }
    const timer = setTimeout(() => { if(!rankReady){ rankState = 'slow'; renderRank(); } }, 10000);
    db.collection(RANK_COL).orderBy('distance', 'desc').limit(100).onSnapshot(snap => {
      if(!snap.metadata.fromCache){ clearTimeout(timer); }
      rankReady = true; rankState = 'ok';
      rankDocs = snap.docs.map(d => ({ id: d.id, ...(d.data() || {}) })).filter(validDoc);
      renderRank(); updateResultRank();
    }, err => { clearTimeout(timer); rankState = (err && err.code === 'revoked') ? 'off' : 'error'; renderRank(); });
  }catch(e){ rankState = 'off'; renderRank(); }
})();
function myRank(){ if(!uid) return null; const i = rankDocs.findIndex(d => d.id === uid); return i >= 0 ? i + 1 : null; }
function updateResultRank(){
  const r = myRank();
  $('rRank').textContent = r ? `${r} 位` : (rankState === 'ok' && uid && best ? '100位圏外' : '--');
}
function renderRank(){
  const st = $('rankStatus'), list = $('rankList');
  const msgs = {
    loading: 'ランキングを読み込み中…',
    slow: 'ランキングに接続できません。しばらくしてから開き直してください。',
    error: 'ランキングを読み込めませんでした。',
    off: 'このページの表示環境ではオンラインランキングに接続できません。'
  };
  if(rankState !== 'ok'){ st.textContent = msgs[rankState] || ''; if(rankState !== 'slow') list.innerHTML = ''; }
  else st.textContent = rankDocs.length ? `上位 ${Math.min(100, rankDocs.length)} 件・記録を更新すると自動で反映されます` : 'まだ記録がありません。最初の記録をつくろう！';
  if(rankState !== 'ok' && rankState !== 'slow') return;
  list.innerHTML = '';
  rankDocs.forEach((d, i) => {
    const li = document.createElement('li'); if(d.id === uid) li.className = 'me';
    const rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = i + 1;
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = String(d.name || 'PLAYER').slice(0, 12);
    const g = String(d.grade || '');
    const gd = document.createElement('span'); gd.className = 'gd ' + (['PERFECT', 'GREAT', 'GOOD'].includes(g) ? g : ''); gd.textContent = ['PERFECT', 'GREAT', 'GOOD'].includes(g) ? g : '-';
    const ds = document.createElement('span'); ds.className = 'ds'; ds.textContent = fmtKm(d.distance);
    li.append(rk, nm, gd, ds);
    if(d.place){ const pl = document.createElement('span'); pl.className = 'pl'; pl.textContent = '📍 ' + String(d.place).slice(0, 40); li.appendChild(pl); }
    list.appendChild(li);
  });
}
async function dbTry(fn){
  try{ return await fn(); }
  catch(e){ if(e && e.code === 'unavailable'){ await sleep(300 + Math.random() * 500); return await fn(); } throw e; }
}
let submitting = false;
async function submitScore(rec){
  const note = $('rNote');
  if(!db || !uid){ note.textContent = rankState === 'off' ? '' : 'ランキングに接続中のため、今回の記録は登録されませんでした'; return; }
  if(submitting) return; submitting = true;
  try{
    const ref = db.doc(RANK_COL + '/' + uid);
    const cur = await dbTry(() => ref.get());
    const prev = cur.exists ? cur.data() : null;
    if(prev && validDoc(prev) && prev.distance >= rec.distance){
      if(prev.name !== myName) await dbTry(() => ref.update({ name: myName }));
      note.textContent = `ランキング登録中の記録：${fmtKm(prev.distance)}`;
    } else {
      await dbTry(() => ref.set({ name: myName, distance: rec.distance, grade: rec.grade, place: rec.place, err: rec.err, ts: Date.now() }));
      note.textContent = '🌍 世界ランキングに反映しました！';
    }
  }catch(e){
    note.textContent = (e && e.code === 'invalid_argument') ? '閲覧のみの権限のため、ランキングには登録できません' : 'ランキングへの登録に失敗しました';
  }finally{ submitting = false; }
}
async function saveName(){
  const v = $('nameIn').value.trim().slice(0, 12);
  if(!v){ toast('名前を入力してください'); return; }
  myName = v; store.set('pt_name', v); toast('名前を保存しました');
  if(db && uid){
    try{
      const ref = db.doc(RANK_COL + '/' + uid); const cur = await ref.get();
      if(cur.exists && cur.data().name !== v) await ref.update({ name: v });
    }catch(e){}
  }
}

// 自分のサイトで公開したとき：Claudeのランキング機能は使えないので、ランキングの表示を隠す
(function hideRankingIfStandalone(){
  if(window.claude && typeof window.claude.use === 'function') return;
  const css = document.createElement('style');
  css.textContent = '#btnRank,#bRank2,.rows div:nth-child(3){display:none!important}';
  document.head.appendChild(css);
})();
</script>
